server:
  port: 3001

app:
  jwt:
    issuer: "my-spot"
    secret: "dev-only-change-me-dev-only-change-me"
    ttlSeconds: 86400
  security:
    allowDevOtpEcho: true
    allowDevAdminKey: true
    devAdminKey: "dev-admin-key"
  trading:
    defaultFeeBps: 10
    klineIntervalSeconds: 60

spring:
  datasource:
    url: jdbc:h2:file:./data/dev;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2

logging:
  level:
    root: INFO
  file:
    name: ./backend.log
